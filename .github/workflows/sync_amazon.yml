name: Sync Amazon
on:
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install gspread google-auth supabase
      - name: Ghi key service account ra file
        env:
          SA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$SA_JSON" > key.json
      - run: python sync_amazon_sheet.py
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: key.json
          SHEET_ID_AMZ: ${{ secrets.SHEET_ID_AMZ }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
