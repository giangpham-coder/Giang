name: Sync Amazon
on:
  workflow_dispatch: {}
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install gspread google-auth supabase
      - name: Write Google service account key to file
        run: echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' | base64 -d > service_account.json
      - name: Sync Amazon sheet to web
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: service_account.json
          SHEET_ID_AMZ: ${{ secrets.SHEET_ID_AMZ }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python sync_amazon_sheet.py
